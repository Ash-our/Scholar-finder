name: scholarship-map
x-app-environment: &app-environment
  SM_MONGO_URI: mongodb://mongo:27017
  SM_MONGO_DATABASE: scholarshipmap
  SM_KAFKA_BOOTSTRAP: kafka:9092
  SM_KAFKA_TOPIC: scholarships.raw
  SM_CHECKPOINT_DIR: /app/data/checkpoints
  SM_SPARK_MASTER: local[2]
  SPARK_LOCAL_IP: "127.0.0.1"

services:
  mongo:
    image: mongo:8.0.38
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    ports: ["127.0.0.1:27018:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:19092:19092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 25

  api:
    build: { context: ., dockerfile: infra/Dockerfile, target: api }
    environment: *app-environment
    ports: ["127.0.0.1:8080:8000"]
    depends_on: { mongo: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 15

  streaming:
    build: { context: ., dockerfile: infra/Dockerfile, target: spark }
    environment: *app-environment
    depends_on: { kafka: { condition: service_healthy }, mongo: { condition: service_healthy } }
    volumes: [checkpoints:/app/data/checkpoints]
    restart: unless-stopped

  collectors:
    build: { context: ., dockerfile: infra/Dockerfile, target: api }
    environment: *app-environment
    command: ["python", "-m", "scholarship_map.cli", "collect", "--watch", "--interval", "21600"]
    depends_on: { kafka: { condition: service_healthy }, mongo: { condition: service_healthy } }
    restart: unless-stopped

  batch:
    build: { context: ., dockerfile: infra/Dockerfile, target: spark }
    environment: *app-environment
    command: ["python", "-m", "scholarship_map.cli", "batch", "--watch", "--interval", "900"]
    depends_on: { mongo: { condition: service_healthy } }
    restart: unless-stopped

  streaming-demo:
    profiles: [demo]
    build: { context: ., dockerfile: infra/Dockerfile, target: spark }
    environment: *app-environment
    command: ["python", "-m", "scholarship_map.cli", "stream", "--demo"]
    depends_on: { kafka: { condition: service_healthy }, mongo: { condition: service_healthy } }
    volumes: [checkpoints:/app/data/checkpoints]

  replay:
    profiles: [tools]
    build: { context: ., dockerfile: infra/Dockerfile, target: api }
    environment: *app-environment
    command: ["python", "-m", "scholarship_map.cli", "replay", "--rate", "10"]
    depends_on: { kafka: { condition: service_healthy }, mongo: { condition: service_healthy } }

  benchmark:
    profiles: [tools]
    build: { context: ., dockerfile: infra/Dockerfile, target: spark }
    environment: *app-environment
    command: ["python", "-m", "scholarship_map.cli", "benchmark"]
    volumes: [./benchmarks/results:/app/benchmarks/results]

volumes:
  mongo-data:
  kafka-data:
  checkpoints:
